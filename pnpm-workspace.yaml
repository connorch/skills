packages:
  - apps/*
  - packages/*
  - instructions

# true = allowed to run build scripts.
allowBuilds:
  esbuild: true
  workerd: false

catalog:
  "@types/node": 24.12.4
  # Runs `pnpm ship`. Pinned exactly: the CLI and the schema fleet.config.jsonc is checked against are one version.
  fleetfizz: 0.1.0
  # The installer behind ship:machine. Pinned exactly: every Machine must run the same one.
  skills: 1.7.0
  typescript: ~6.0.3
  vite: npm:@voidzero-dev/vite-plus-core@1.0.0-rc.0
  vite-plus: 1.0.0-rc.0

# Our own package: a bump in the catalog is deliberate, so skip the release-age wait.
minimumReleaseAgeExclude:
  - fleetfizz

overrides:
  "@types/node": "catalog:"
  typescript: "catalog:"
  vite: "catalog:"

packageExtensions:
  vite-plus@*:
    dependencies:
      vite: "catalog:"

peerDependencyRules:
  allowAny:
    - vite
  allowedVersions:
    vite: "*"
